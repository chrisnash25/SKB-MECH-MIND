<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>DROPZONE - Yate Town Centre</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Original Yate Free Roam soundtrack and accessible start settings */
#dz-music-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;background:linear-gradient(135deg,rgba(2,7,19,.96),rgba(8,16,40,.89)),url("index.png") center/cover;font:16px Arial,sans-serif;touch-action:manipulation}
#dz-music-overlay.dz-hidden{display:none}
#dz-start-card{width:min(92vw,510px);max-height:90vh;overflow-y:auto;box-sizing:border-box;padding:26px;border:1px solid rgba(255,215,76,.6);border-radius:18px;background:rgba(6,12,29,.93);box-shadow:0 20px 70px rgba(0,0,0,.65);text-align:center}
#dz-start-card h1{font-size:clamp(25px,5vw,43px);letter-spacing:2px;color:#ffda52;margin:0 0 4px}
#dz-start-card p{color:#ccd7eb;font-size:14px;line-height:1.5;margin:8px 0 20px}
.dz-audio-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px 0;text-align:left}
.dz-audio-row input[type=range]{flex:1;min-width:90px;accent-color:#ffdb52;touch-action:manipulation}
.dz-audio-row input[type=checkbox]{width:22px;height:22px;accent-color:#ffdb52}
#dz-launch{width:100%;margin-top:12px;padding:15px;background:#ffda52;color:#10151e;font-size:20px;font-weight:bold;letter-spacing:.7px;border:none;border-radius:9px;cursor:pointer}
#dz-launch:disabled{opacity:.55}
#dz-music-info{font-size:12px!important;color:#90a0bd!important;margin-bottom:0!important}
#dz-music-toolbar{position:fixed;bottom:calc(9px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:25;font:14px Arial,sans-serif}
#dz-music-toolbar[hidden],#dz-settings-panel[hidden]{display:none!important}
#dz-music-menu{border:1px solid #9b9a8b;background:rgba(12,19,32,.8);border-radius:8px;padding:5px 13px;color:white;cursor:pointer;touch-action:manipulation}
#dz-settings-panel{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);width:min(90vw,295px);box-sizing:border-box;background:#111a2e;border:1px solid #bba960;border-radius:10px;padding:12px 16px}
#dz-settings-panel .dz-audio-row{margin:10px 0}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

    <audio id="dz-original-track" preload="auto" src="https://github.com/chrisnash25/Drop-Zone-Android/releases/download/soundtrack-v1/Yate-Free-Roam.mp3"></audio>
    <section id="dz-music-overlay" aria-label="Yate Free Roam start screen">
      <div id="dz-start-card">
        <h1>YATE FREE ROAM</h1>
        <p>DROPZONE — Yate Town Centre<br>Original soundtrack: Yate Free Roam</p>
        <label class="dz-audio-row"><span>🎵 Background music</span><input id="dz-music-enabled" type="checkbox" checked></label>
        <label class="dz-audio-row"><span>Music volume</span><input id="dz-music-volume" aria-label="Music volume" type="range" min="0" max="100" step="5" value="70"></label>
        <button id="dz-launch" type="button">▶ START GAME</button>
        <p id="dz-music-info">Music plays during loading and continues into gameplay, once per session. You can switch it off at any time.</p>
      </div>
    </section>
    <div id="dz-music-toolbar" hidden>
      <button id="dz-music-menu" type="button" aria-expanded="false" aria-controls="dz-settings-panel">♫ MUSIC</button>
      <div id="dz-settings-panel" hidden>
        <label class="dz-audio-row"><span>Music On / Off</span><input id="dz-music-enabled-in-game" type="checkbox" checked></label>
        <label class="dz-audio-row"><span>Volume</span><input id="dz-music-volume-in-game" aria-label="In-game music volume" type="range" min="0" max="100" step="5" value="70"></label>

<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":47008596,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

function launchGodotEngine() {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}

(function setupOriginalSoundtrack() {
  const audio = document.getElementById("dz-original-track");
  const screen = document.getElementById("dz-music-overlay");
  const toolbar = document.getElementById("dz-music-toolbar");
  const settings = document.getElementById("dz-settings-panel");
  const enabledBoxes = [document.getElementById("dz-music-enabled"),document.getElementById("dz-music-enabled-in-game")];
  const volumeSliders = [document.getElementById("dz-music-volume"),document.getElementById("dz-music-volume-in-game")];
  const read = (key, fallback) => { try { return localStorage.getItem(key) ?? fallback; } catch (_) { return fallback; } };
  const store = (key, value) => { try { localStorage.setItem(key, String(value)); } catch (_) {} };
  let enabled = read("dz-original-music-enabled", "true") === "true";
  let volume = Math.max(0,Math.min(100,Number(read("dz-original-music-volume", "70")) || 0));
  let launched = false;
  const apply = () => {
    enabledBoxes.forEach(el => { el.checked=enabled; });
    volumeSliders.forEach(el => { el.value=volume; el.disabled=!enabled; });
    audio.volume=volume/100;
  };
  const play = () => {
    if (!enabled || audio.ended) return;
    const promise=audio.play();
    if (promise && typeof promise.catch === "function") {
      promise.catch(err => console.warn("Soundtrack requires user interaction:",err));
    }
  };
  enabledBoxes.forEach(el => el.addEventListener("change", () => {
    enabled=el.checked; store("dz-original-music-enabled",enabled); apply();
    if (enabled && launched) play(); else if (!enabled) audio.pause();
  }));
  volumeSliders.forEach(el => el.addEventListener("input", () => {
    volume=Math.max(0,Math.min(100,Number(el.value))); store("dz-original-music-volume",volume); apply();
  }));
  document.getElementById("dz-launch").addEventListener("click", () => {
    if (launched) return;
    launched = true;
    if (enabled) play(); // Click unlocks the Web Audio playback restriction.
    screen.classList.add("dz-hidden");
    toolbar.hidden = false;
    launchGodotEngine(); // Start the existing, unmodified Godot game download here.
  });
  document.getElementById("dz-music-menu").addEventListener("click", () => {
    settings.hidden=!settings.hidden;
    document.getElementById("dz-music-menu").setAttribute("aria-expanded",String(!settings.hidden));
  });
  apply();
})();
		</script>
