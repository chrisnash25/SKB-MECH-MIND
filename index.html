function partialConcept(answer,q){let groups=partialConcepts[q.name];if(!groups)return null;let s=norm(answer);if(s.split(' ').length<4)return null;let neg=['does not','doesn t','doesnt','not connected','no movement','no motion','both directions','makes it faster'].some(w=>hasTerm(s,w));if(neg||(q.name!=='CV joint'&&hasTerm(s,'same speed')))return null;const matches = rule => rule.every(group => group.some(term => hasTerm(s,term)));

g.round*2+g.turn)return;let a=$('battleAnswer').value.trim();if(!a)return;let r=evaluate(a,g.pool[g.round]),pts=r.ok?Math.max(0,(r.partial?70:140)-g.hints*25):0;g.locked.push({turn:g.turn,answer:a,pts,ok:r.ok,partial:!!r.partial,reason:r.reason,hints:g.hints});if(g.turn===1){g.scores[0]+=g.locked[g.locked.length-2].pts;g.scores[1]+=pts}draw(`<div class="panel"><h1>Answer locked 🔒</h1><p>Answer recorded. Points will be shown after both players finish.</p><p class="muted">${g.turn===0?'Pass the phone to Player 2.':'Both players have finished this round.'}</p><button onclick="nextBattle()">${g.turn===0?'Next player':'See round result'}</button></div>`)}function nextBattle(){let g=game;if(!g||g.type!=="battle"||g.locked.length!==g.round*2+g.turn+1)return;if(g.turn===0){g.turn=1;g.hints=0;battle()}else{showBattleResult()}}function showBattleResult(){let g=game,q=g.pool[g.round];draw(`<div class="panel"><h1>Round ${g.round+1} reveal</h1><h2>${esc(q.name)}</h2><p>${esc(q.hint)}</p><p class="muted">Offline scoring is provisional. The buttons below are optional corrections, not the game's verdict. Change a result only if the automatic judgment was wrong.</p>${g.locked.slice(-2).map((rec,i)=>`<div class="notice"><b>Player ${i+1}</b><p>${esc(rec.answer)}</p><p>${rec.reviewed?"Manually reviewed":rec.partial?"Concept recognised — informal terms":rec.ok?"Automatically accepted":"Not automatically recognised"} · ${rec.pts} points${rec.reason?'<p class="small">'+esc(rec.reason)+'</p>':''}</p><button class="alt" onclick="adjustBattle(${i},${!rec.ok})">${rec.ok?"Change to incorrect":"Change to correct"}</button></div>`).join("")}<div class="row"><div>Player 1: <b>${g.locked[g.locked.length-2].pts}</b></div><div>Player 2: <b>${g.locked[g.locked.length-1].pts}</b></div></div><p class="score">${g.scores[0]} — ${g.scores[1]}</p><button onclick="advanceBattle()">${g.round===4?'Final result':'Next round'}</button></div>`)}function adjustBattle(turn,correct){let g=game;if(!g||g.type!=="battle"||g.turn!==1||g.locked.length!==(g.round+1)*2||![0,1].includes(turn))return;let rec=g.locked[g.locked.length-2+turn];if(!rec)return;let revised=correct?Math.max(0,(rec.partial?70:140)-(rec.hints||0)*25):0;g.scores[turn]+=revised-rec.pts;rec.pts=revised;rec.ok=correct;rec.reviewed=true;showBattleResult()}function advanceBattle(){if(!game||game.type!=="battle"||game.round>=5||game.turn!==1||game.locked.length!==(game.round+1)*2)return;game.round++;game.turn=0;game.hints=0;battle()}
const prompts=['A robot must grip both fragile glass and heavy steel. Design the mechanism.','A machine must turn continuous rotation into intermittent straight-line motion. How?','A pump must move liquid without letting it touch moving metal parts. How?','A wheel is stuck against a tall step. Invent a mechanism that helps it climb.','A machine needs a speed reduction but very little space. Propose a mechanism.'];function inventor(){let q=prompts[random(prompts.length)];draw(`<button class="alt" onclick="home()">← Workshop</button><div class="panel"><span class="tag">INVENTOR LAB</span><h1>💡 Solve an engineering problem</h1><p>${esc(q)}</p><textarea id="idea" placeholder="Describe components, energy source, motion and limitations"></textarea><button onclick="saveIdea('${q.replaceAll("'","\\'")}')">Save invention</button><div id="feedback"></div><p class="muted small">Your design is saved locally. It has not been evaluated by AI or physically tested.</p></div>`)}function saveIdea(q){let v=$('idea').value.trim();if(v.length<20){$('feedback').textContent='Describe the idea in a bit more detail.';return}data.ideas.push({question:q,idea:v,date:new Date().toISOString()});save();$('feedback').innerHTML='<div class="notice good">Idea saved in My Workshop.</div>'}function progress(){draw(`<button class="alt" onclick="home()">← Workshop</button><h1>🏆 My Workshop</h1><div class="grid"><div class="panel"><div class="score">${data.xp}</div>XP</div><div class="panel"><div class="score">${data.solved.length}</div>Discoveries</div><div class="panel"><div class="score">${data.wins}</div>Player 1 wins</div><div class="panel"><div class="score">${data.ideas.length}</div>Inventions</div></div><div class="panel"><h2>Discovered mechanisms</h2>${data.solved.length?data.solved.map(x=>`<p>⚙️ ${esc(x)}</p>`).join(''):'<p class="muted">Your discoveries appear here.</p>'}</div><div class="panel"><h2>Saved inventions</h2>${data.ideas.length?data.ideas.slice(-10).reverse().map(x=>`<p><b>${esc(x.question)}</b><br>${esc(x.idea)}</p>`).join('<hr>'):'<p class="muted">Your invention notes appear here.</p>'}</div>`)}
home();
</script></body></html>
