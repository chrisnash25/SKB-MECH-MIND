name: Verify Live DROPZONE Play URL
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-dropzone-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public game and actual binary assets
        run: |
          set -e
          base="https://chrisnash25.github.io/SKB-MECH-MIND/dropzone"
          for f in index.html index.js index.wasm index.pck BUILD_INFO.txt; do
            echo "CHECK $base/$f"
            curl -fL --retry 5 --retry-delay 5 -sS -o /dev/null -w "HTTP %{http_code} bytes %{size_download} type %{content_type}\n" "$base/$f"
          done
          curl -fLsS "$base/index.html" | grep -q 'index.pck'
          echo "PUBLIC DROPZONE ASSETS VERIFIED"
