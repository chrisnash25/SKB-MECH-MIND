name: Emotional Support Brick — 3D Skins
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-brick-3d.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify standalone WebGL 2 game
        env:
          SOURCE_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-3dc0-8243-9ad0-7264e0111340/raw?se=2026-11-21T01%3A59%3A30Z&sp=r&sv=2026-06-06&sr=b&scid=e3d79e83-fb4b-5b0b-8319-28f63ac8ed83&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-20T05%3A34%3A45Z&ske=2026-11-21T05%3A34%3A45Z&sks=b&skv=2026-06-06&sig=n6N1NP5Ft7hy%2Bi5ibC%2B4EvS35UUXxDZ37Nf9H5wHOoc%3D'
        run: |
          set -eu
          curl -fLsS --retry 3 "$SOURCE_URL" -o /tmp/brick.html
          echo '53b73233cd81ec9e125bffcf340a60d9dd3d7357be78755d5f51bd919213d71a  /tmp/brick.html' | sha256sum -c -
          grep -q 'data-skin="human"' /tmp/brick.html
          grep -q 'data-skin="puppet"' /tmp/brick.html
          grep -q "canvas.getContext('webgl2'" /tmp/brick.html
          grep -q 'bricko_save' /tmp/brick.html
      - name: Publish separate Bricko game without modifying DROPZONE
        run: |
          mkdir -p brick
          cp /tmp/brick.html brick/index.html
          printf 'Emotional Support Brick 3D v0.3: WebGL2 studio, human face, Muppet-style puppet face, 1080p option, preserved v0.2 game systems and saves.\n' > brick/BUILD_INFO.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brick/
          git commit -m "Publish Bricko 3D human and Muppet-style face skins" || exit 0
          git push origin HEAD:main
