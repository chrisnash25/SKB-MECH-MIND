name: Install verified Yate original MP3 to live game
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-yate-original-music.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-music:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified original soundtrack from own GitHub release
        run: |
          curl --fail --location --retry 3 'https://github.com/chrisnash25/Drop-Zone-Android/releases/download/soundtrack-v1/Yate-Free-Roam.mp3' -o dropzone/Yate-Free-Roam.mp3
          echo '8e905410b3be224860c11e7fce16b042142d8b5052508e953cd5a494f7288c38  dropzone/Yate-Free-Roam.mp3' | sha256sum -c -
          test "$(stat -c%s dropzone/Yate-Free-Roam.mp3)" -eq 4750606
      - name: Commit MP3 into existing GitHub Pages game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dropzone/Yate-Free-Roam.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'Ship original Yate Free Roam soundtrack with browser game'
            git push origin HEAD:main
          fi
