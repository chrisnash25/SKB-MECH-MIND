name: Build rigged brick cast GLBs
on:
  push:
    paths:
      - 'tools/build_brick_cast.py'
      - '.github/workflows/build-brick-cast.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - name: Verify Blender Python dependencies
        run: blender -b -noaudio --python-expr "import numpy; print('NumPy available:', numpy.__version__)"
      - name: Export ten individually rigged characters
        run: blender -b -noaudio --python tools/build_brick_cast.py
      - name: Validate generated GLB files
        run: |
          python3 - <<'PY'
          import glob,struct
          files=glob.glob('emotional-support-brick-3d/assets/cast/*.glb')
          assert len(files)==10,files
          expected={'bricko','rusty','pulse','calm','spark','blocky','cozy','zapp','echo','gizmo'}
          assert {p.rsplit('/',1)[-1].removesuffix('.glb') for p in files}==expected,files
          for p in files:
              with open(p,'rb') as f: h=f.read(12)
              assert h[:4]==b'glTF' and struct.unpack('<I',h[8:12])[0]>5000,p
          print('Validated',len(files),'rigged assets')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: emotional-brick-ten-rigged-models
          path: emotional-support-brick-3d/assets/cast/*.glb
      - name: Publish assets to game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emotional-support-brick-3d/assets/cast/*.glb
          git diff --cached --quiet || (git commit -m "Publish ten rigged brick character GLBs" && git pull --rebase && git push)
