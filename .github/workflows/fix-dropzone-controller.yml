name: DROPZONE Fix Analog Sticks and Publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-dropzone-controller.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve corrected game project
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a710-81f4-bb38-8532b6bf4e6f/raw?se=2026-11-20T03%3A29%3A39Z&sp=r&sv=2026-06-06&sr=b&scid=6f70af54-8bf6-5a6f-a41e-e63d6a61301a&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-19T19%3A30%3A45Z&ske=2026-11-20T19%3A30%3A45Z&sks=b&skv=2026-06-06&sig=mbecZ2KGpcgakCFPg5HhbtoXIQimF38Y9nWkdVd/dyM%3D'
        run: |
          curl -fLsS --retry 3 "$SOURCE_URL" -o /tmp/game.zip
          echo 'e681c3ea568a67e4535e41b9bf064dcd31b42226f6d68b028a0428fb6f9ffd80  /tmp/game.zip' | sha256sum -c -
          mkdir -p /tmp/game
          unzip -q /tmp/game.zip -d /tmp/game
          test -f /tmp/game/scripts/game.gd
          grep -q 'var pad_move := Vector2(Input.get_joy_axis(0, JOY_AXIS_LEFT_X)' /tmp/game/scripts/game.gd
          grep -q 'var pad_look := Vector2(Input.get_joy_axis(0, JOY_AXIS_RIGHT_X)' /tmp/game/scripts/game.gd
          grep -q 'JOY_AXIS_RIGHT_X' /tmp/game/scripts/game.gd
      - name: Install Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates-dir
          cp -a /tmp/templates-dir/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
      - name: Export browser game with corrected sticks
        run: |
          mkdir -p /tmp/web
          cat > /tmp/game/export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../web/index.html"
          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF
          godot --headless --path /tmp/game --editor --import
          godot --headless --path /tmp/game --export-release Web /tmp/web/index.html
          test -s /tmp/web/index.html
          test -s /tmp/web/index.pck
          test -s /tmp/web/index.wasm
          test "$(stat -c '%s' /tmp/web/index.pck)" -lt 100000000
      - name: Publish latest controller fix
        run: |
          mkdir -p dropzone
          cp -a /tmp/web/. dropzone/
          rm -f dropzone/index.pck.part0 dropzone/index.pck.part1 dropzone/split-pck-sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dropzone/index.html')
          s=p.read_text()
          tag='<script src="index.js"></script>'
          assert tag in s
          s=s.replace(tag,"""<script>
          try { if (window.devicePixelRatio > 1) Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:()=>1}); } catch(e) {}
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.filter(r=>r.scope.includes('/dropzone/')).forEach(r=>r.unregister())).catch(()=>{});
          </script>
          """+tag,1)
          p.write_text(s)
          Path('dropzone/BUILD_INFO.txt').write_text('DROPZONE controller fix 20 Nov 2026: left stick movement, right stick camera, deadzone 0.19; touchscreen swapped; low memory web build.\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dropzone/
          git commit -m "Fix DROPZONE standard Xbox controls" || exit 0
          git push origin HEAD:main
