name: DROPZONE Restore Tesco Graphics and Xbox Buttons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-dropzone-controller.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve corrected game project
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3908-8210-adc0-26b13215e349/raw?se=2026-11-20T03%3A50%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=01ed4c35-bbc7-565f-9526-3674d0e6d9be&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-19T19%3A38%3A35Z&ske=2026-11-20T19%3A38%3A35Z&sks=b&skv=2026-06-06&sig=jlyRxcfxX6mEJ%2BrpdrzVc8yYrvx9G12Eg%2BN77bzUC5g%3D'
        run: |
          curl -fLsS --retry 3 "$SOURCE_URL" -o /tmp/game.zip
          echo '59431acadf89416d7393edd288cdaf696497d7c73dd70d9465e951291fc42802  /tmp/game.zip' | sha256sum -c -
          mkdir -p /tmp/game
          unzip -q /tmp/game.zip -d /tmp/game
          test -f /tmp/game/scripts/game.gd
          grep -q 'JOY_AXIS_LEFT_X' /tmp/game/scripts/game.gd
          grep -q 'JOY_AXIS_RIGHT_X' /tmp/game/scripts/game.gd
          grep -q 'JOY_AXIS_TRIGGER_RIGHT' /tmp/game/scripts/game.gd
          grep -q 'JOY_BUTTON_START' /tmp/game/scripts/gamepad_hotkeys.gd
          grep -q 'JOY_BUTTON_BACK' /tmp/game/scripts/gamepad_hotkeys.gd
          for asset in assets/environment/TescoCanopy.glb assets/environment/TescoFrontage.glb assets/environment/NorthWalkCanopy.glb world/TescoCanopy.tscn world/TescoFrontage.tscn world/NorthWalkCanopy.tscn; do
            test -s "/tmp/game/$asset" || exit 1
          done
      - name: Install Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates-dir
          cp -a /tmp/templates-dir/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
      - name: Import 3D models, textures and audio before runtime checks
        run: |
          godot --headless --path /tmp/game --editor --import 2>&1 | tee /tmp/import.log
          test -d /tmp/game/.godot/imported
          test -n "$(find /tmp/game/.godot/imported -name '*.scn' -print -quit)"
      - name: Verify gamepad buttons in Godot
        run: |
          godot --headless --path /tmp/game --script res://tests/gamepad_smoke.gd 2>&1 | tee /tmp/gamepad-smoke.log
          grep -q 'GAMEPAD_SMOKE_PASS' /tmp/gamepad-smoke.log
      - name: Validate latest map startup
        run: |
          timeout 100s godot --headless --path /tmp/game --quit-after 35 2>&1 | tee /tmp/game-runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/game-runtime.log; then exit 1; fi
      - name: Export browser game with corrected sticks
        run: |
          mkdir -p /tmp/web
          cat > /tmp/game/export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../web/index.html"
          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF
          godot --headless --path /tmp/game --export-release Web /tmp/web/index.html
          test -s /tmp/web/index.html
          test -s /tmp/web/index.pck
          test -s /tmp/web/index.wasm
          test "$(stat -c '%s' /tmp/web/index.pck)" -lt 100000000
      - name: Publish latest controller fix
        run: |
          mkdir -p dropzone
          cp -a /tmp/web/. dropzone/
          rm -f dropzone/index.pck.part0 dropzone/index.pck.part1 dropzone/split-pck-sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dropzone/index.html')
          s=p.read_text()
          tag='<script src="index.js"></script>'
          assert tag in s
          s=s.replace(tag,"""<script>
          try { if (window.devicePixelRatio > 1) Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:()=>1}); } catch(e) {}
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.filter(r=>r.scope.includes('/dropzone/')).forEach(r=>r.unregister())).catch(()=>{});
          </script>
          """+tag,1)
          p.write_text(s)
          Path('dropzone/BUILD_INFO.txt').write_text('DROPZONE West Walk Parking + Tesco frontage and wave canopy, North Walk canopy, McDonalds, centre shops. 20 Nov 2026: Xbox left move/right look; Start menu, View map, A jump, B crouch, X punch, Y reload, LT aim, RT fire. Graphics Performance/Quality.\\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dropzone/
          git commit -m "Restore Tesco and canopy visibility and map Xbox controls" || exit 0
          git push origin HEAD:main
