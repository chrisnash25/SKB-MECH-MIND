name: Browser Smoke Test DROPZONE
# Tesco Xbox validation: latest landmark graphics and gamepad HUD, 2026-11-20
on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-smoke-dropzone.yml', 'dropzone/index.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Chromium browser automation
        run: |
          mkdir -p /tmp/webtest && cd /tmp/webtest
          npm init -y >/dev/null
          npm install playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Load actual published game
        run: |
          cat > /tmp/webtest/test.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror', e=>errors.push(e.message));
            page.on('console', m=>{if(m.type()==='error')errors.push(m.text())});
            const response=await page.goto('https://chrisnash25.github.io/SKB-MECH-MIND/dropzone/',{waitUntil:'domcontentloaded',timeout:60000});
            console.log('PAGE HTTP',response.status());
            await page.waitForSelector('#dz-launch',{timeout:15000});
            const mp3=page.locator('#dz-original-track');
            const trackUrl=await mp3.getAttribute('src');
            if(!trackUrl || !trackUrl.includes('/soundtrack-v1/Yate-Free-Roam.mp3')) throw new Error('Soundtrack URL missing');
            await page.locator('#dz-launch').click();
            await page.waitForTimeout(8500);
            let audio=await mp3.evaluate(el=>({time:el.currentTime,paused:el.paused,ready:el.readyState,duration:el.duration,error:el.error?.message||null,loop:el.loop}));
            console.log('AUDIO AFTER START',JSON.stringify(audio));
            if(audio.error || audio.paused || audio.time < 0.5 || audio.duration < 200 || audio.loop) throw new Error('Original soundtrack playback validation failed');
            await page.locator('#dz-music-menu').click();
            await page.locator('#dz-music-enabled-in-game').uncheck();
            await page.waitForTimeout(500);
            if(!(await mp3.evaluate(el=>el.paused))) throw new Error('Music Off does not pause');
            await page.locator('#dz-music-enabled-in-game').check();
            await page.waitForTimeout(1000);
            if((await mp3.evaluate(el=>el.paused))) throw new Error('Music On does not resume');
            if((await page.evaluate(()=>localStorage.getItem('dz-original-music-enabled'))) !== 'true') throw new Error('Music preference not persisted');
            await page.locator('#dz-music-menu').click();
            await page.waitForTimeout(16000);
            console.log('TITLE',await page.title());
            console.log('CANVAS',await page.locator('canvas').count());
            console.log('ERRORS',JSON.stringify(errors.slice(0,20)));
            const body=await page.locator('body').innerText();
            console.log('VISIBLE TEXT',body.slice(0,500));
            await page.screenshot({path:'/tmp/dropzone-live.png',timeout:10000}).catch(e=>console.log('SCREENSHOT_ERROR',e.message));
            if(response.status()!==200 || errors.some(e=>/failed to fetch|failed to load|error loading|out of memory|runtimeerror|abort\(/i.test(e))) process.exitCode=1;
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          timeout 100s node /tmp/webtest/test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dropzone-live-browser-screenshot
          path: /tmp/dropzone-live.png
          if-no-files-found: ignore
