name: Ten separate reference PNG to rigged 3D models
on:
  push:
    branches: [reference-png-ten-real-mesh-and-animation]
    paths:
      - 'tools/produce_reference_png_3d.py'
      - 'tools/render_reference_png_3d.py'
      - 'tools/rig_trellis_cast.py'
      - '.github/workflows/reference-png-ten-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        character: [bricko, rusty, pulse, calm, spark, blocky, cozy, zapp, echo, gizmo]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CHARACTER: ${{ matrix.character }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free generator client
        run: pip install --disable-pip-version-check 'gradio_client>=1.4,<3' Pillow requests
      - name: Convert approved PNG into actual 3D mesh
        shell: bash
        run: |
          set -o pipefail
          python tools/produce_reference_png_3d.py 2>&1 | tee model.log
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - name: Rig and animate the real mesh
        run: |
          blender -b -noaudio --python-exit-code 1 --python tools/rig_trellis_cast.py -- \
            "emotional-support-brick-3d/staging/reference-png-cast/$CHARACTER/$CHARACTER-raw.glb" \
            "emotional-support-brick-3d/staging/reference-png-cast/$CHARACTER/$CHARACTER-animated.glb"
      - name: Verify PBR texture, rig and animation structure
        run: |
          python - <<'PY'
          import json,struct,os,pathlib
          name=os.environ['CHARACTER']
          p=pathlib.Path(f'emotional-support-brick-3d/staging/reference-png-cast/{name}/{name}-animated.glb')
          b=p.read_bytes()
          assert b[:4]==b'glTF' and len(b)>100000
          n=struct.unpack_from('<I',b,12)[0]
          d=json.loads(b[20:20+n])
          assert d.get('skins') and len(d.get('animations',[]))>=4, 'Missing skin or four animation clips'
          assert d.get('materials') and d.get('textures') and d.get('images'), 'Rejected: no embedded PBR material textures'
          textured=[m for m in d['materials'] if m.get('pbrMetallicRoughness',{}).get('baseColorTexture')]
          assert textured, 'Rejected: no PBR base-colour texture is assigned'
          assert all(any('material' in primitive for primitive in mesh.get('primitives',[])) for mesh in d['meshes']), 'Rejected: mesh primitives have no material assignment'
          assert all(a.get('channels') and a.get('samplers') for a in d['animations']), 'Rejected: animation clip has no channels or samplers'
          print('PBR_TEXTURED_ANIMATED_GLB_VALID',name,len(b),len(d['animations']),len(d['textures']),len(d['images']))
          PY
      - name: Render actual 3D model at 1080p
        run: blender -b -noaudio --python-exit-code 1 --python tools/render_reference_png_3d.py
      - name: Preserve all successes and failures for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-png-${{ matrix.character }}-real-3d
          path: |
            model.log
            emotional-support-brick-3d/staging/reference-png-cast/${{ matrix.character }}/
          if-no-files-found: warn
