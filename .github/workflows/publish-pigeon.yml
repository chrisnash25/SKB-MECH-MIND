name: Grand Theft Pigeon — Bristol 3D Web Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pigeon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pigeon:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download independent 3D game source
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-28f8-81f4-9a1d-864faf889f5f/raw?se=2026-11-21T01%3A37%3A41Z&sp=r&sv=2026-06-06&sr=b&scid=1c0ec77a-2d1b-531b-bca5-ff5fcee0805f&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-20T08%3A36%3A00Z&ske=2026-11-21T08%3A36%3A00Z&sks=b&skv=2026-06-06&sig=FkkSD0TXTNgrJW7oagX7xDXG7BTLSRKXfSg29pUtBhY%3D'
        run: |
          set -e
          curl -fLsS --retry 4 "$SOURCE_URL" -o /tmp/pigeon.zip
          echo '7a824542d29eefa1fb22a809c25a4482b89974b9f0d491c8d8641b20345badaf  /tmp/pigeon.zip' | sha256sum -c -
          mkdir -p /tmp/pigeon-game
          unzip -q /tmp/pigeon.zip -d /tmp/pigeon-game
          for f in project.godot scenes/main.tscn scripts/game.gd scripts/map_view.gd tests/smoke.gd audio/flap.wav audio/splat.wav audio/chip.wav; do test -s "/tmp/pigeon-game/$f"; done
      - name: Install Godot 4.6.3 and web templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates-dir
          cp -a /tmp/templates-dir/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
      - name: Import sounds and 3D project
        run: |
          set -o pipefail
          timeout 120s godot --headless --path /tmp/pigeon-game --editor --import 2>&1 | tee /tmp/pigeon-import.log
      - name: Run playable-game smoke tests
        run: |
          set -o pipefail
          timeout 120s godot --headless --path /tmp/pigeon-game --script res://tests/smoke.gd 2>&1 | tee /tmp/pigeon-smoke.log
          grep -q PIGEON_SMOKE_PASS /tmp/pigeon-smoke.log
      - name: Export WebGL 2 browser game
        run: |
          mkdir -p /tmp/pigeon-web
          cat > /tmp/pigeon-game/export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../pigeon-web/index.html"
          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF
          set -o pipefail
          timeout 150s godot --headless --path /tmp/pigeon-game --export-release Web /tmp/pigeon-web/index.html 2>&1 | tee /tmp/pigeon-export.log
          for f in index.html index.js index.wasm index.pck; do test -s "/tmp/pigeon-web/$f"; done
          ls -lh /tmp/pigeon-web/index.*
      - name: Publish separately from DROPZONE
        run: |
          mkdir -p pigeon
          cp -a /tmp/pigeon-web/. pigeon/
          cp /tmp/pigeon.zip pigeon/source.zip
          cp /tmp/pigeon-game/README.md pigeon/README.md
          printf 'Grand Theft Pigeon: Shit Happens — Bristol-inspired 3D open-world prototype v0.2, 21 November 2026. Improved pigeon feathers and folded wings, shopping street paving, planters, zebra crossings, clearer shop signs. 35 pedestrians, 12 cars, 24 chip pickups, flying pigeon, poop projectiles, map, menu, Xbox controls. SHA256 7a824542d29eefa1fb22a809c25a4482b89974b9f0d491c8d8641b20345badaf.\n' > pigeon/BUILD_INFO.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pigeon/
          git commit -m "Publish playable Grand Theft Pigeon Bristol 3D open world" || exit 0
          git push origin HEAD:main
