name: DROPZONE Yate Retail Master Visual Update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-retail-master.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retail-master:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Download complete retail visual project
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a90c-81f4-b9fc-c2311f59a023/raw?se=2026-11-20T04%3A32%3A58Z&sp=r&sv=2026-06-06&sr=b&scid=3f2191ba-46a1-5bd4-b8dc-ce59f84e999b&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-20T04%3A09%3A55Z&ske=2026-11-21T04%3A09%3A55Z&sks=b&skv=2026-06-06&sig=vTLIhQv%2BeYbuvlvyo58fD3C4HIJFCJ8ikMaQ/ah/gKY%3D'
        run: |
          set -e
          curl -fLsS --retry 3 "$SOURCE_URL" -o /tmp/game.zip
          echo 'b13ef5aef6e8be5ee26fb2b1799df59d67ce4777954ff0f6d229aafce2d8b4fb  /tmp/game.zip' | sha256sum -c -
          mkdir -p /tmp/game
          unzip -q /tmp/game.zip -d /tmp/game
          for f in project.godot main.tscn tests/retail_smoke.gd assets/signage/shops_atlas.png assets/signage/tesco_wordmark.png assets/signage/mcdonalds_fascia.png world/retail_furniture.json; do test -s "/tmp/game/$f"; done
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/game')
          d=json.loads((p/'world/streets.json').read_text())
          furniture=json.loads((p/'world/retail_furniture.json').read_text())
          assert len(d['shops'])==73
          assert len(furniture['bollards'])==11
          assert len(furniture['lamps'])==8
          assert len(furniture['parking_signs'])==3
          print('Retail source verified: 73 shop locations, 11 bollards, 8 lamps, 3 parking signs')
          PY
      - name: Install Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates-dir
          cp -a /tmp/templates-dir/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
      - name: Import models, fascia textures and materials
        run: |
          set -o pipefail
          timeout 240s godot --headless --path /tmp/game --editor --import 2>&1 | tee /tmp/import.log
          test -n "$(find /tmp/game/.godot/imported -name '*.scn' -print -quit)"
      - name: Test actual shop and landmark instantiation
        run: |
          set -o pipefail
          timeout 120s godot --headless --path /tmp/game --script res://tests/retail_smoke.gd 2>&1 | tee /tmp/retail-smoke.log
          grep -q RETAIL_MASTER_SMOKE_PASS /tmp/retail-smoke.log
      - name: Preserve gamepad controls
        run: |
          set -o pipefail
          timeout 90s godot --headless --path /tmp/game --script res://tests/gamepad_smoke.gd 2>&1 | tee /tmp/gamepad-smoke.log
          grep -q GAMEPAD_SMOKE_PASS /tmp/gamepad-smoke.log
      - name: Verify game boots without script errors
        run: |
          set -o pipefail
          timeout 120s godot --headless --path /tmp/game --quit-after 35 2>&1 | tee /tmp/runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/runtime.log; then exit 1; fi
      - name: Export web game
        run: |
          mkdir -p /tmp/web
          cat > /tmp/game/export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../web/index.html"
          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF
          godot --headless --path /tmp/game --export-release Web /tmp/web/index.html
          for f in index.html index.js index.wasm index.pck; do test -s "/tmp/web/$f"; done
          test "$(stat -c '%s' /tmp/web/index.pck)" -lt 100000000
          ls -lh /tmp/web/index.*
      - name: Publish all visual improvements together
        run: |
          mkdir -p dropzone
          cp -a /tmp/web/. dropzone/
          rm -f dropzone/index.pck.part0 dropzone/index.pck.part1 dropzone/split-pck-sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dropzone/index.html')
          s=p.read_text()
          tag='<script src="index.js"></script>'
          assert tag in s
          s=s.replace(tag,"""<script>
          try { if (window.devicePixelRatio > 1) Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:()=>1}); } catch(e) {}
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.filter(r=>r.scope.includes('/dropzone/')).forEach(r=>r.unregister())).catch(()=>{});
          </script>
          """+tag,1)
          p.write_text(s)
          Path('dropzone/BUILD_INFO.txt').write_text('DROPZONE Yate Retail Master, 20 November 2026. Based on West Walk Parking with 73 shop locations, new fascia atlas, Tesco and McDonalds branded signage, North Walk canopy lights, bollards, car-park lamps and parking wayfinding. Gameplay and Xbox controls preserved. Source sha256 b13ef5aef6e8be5ee26fb2b1799df59d67ce4777954ff0f6d229aafce2d8b4fb.\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dropzone/
          git commit -m "Publish complete Yate retail master graphics update" || exit 0
          git push origin HEAD:main
