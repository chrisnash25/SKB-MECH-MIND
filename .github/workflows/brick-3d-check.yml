name: Brick 3D browser smoke test
on:
  push:
    paths:
      - 'emotional-support-brick-3d/**'
      - '.github/workflows/brick-3d-check.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brick-3d-visual-check
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local browser game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/brick-server.log 2>&1 &
          sleep 3
      - name: Verify real 3D rendering and controls
        run: |
          cat > /tmp/brick-test.cjs <<'NODE'
          const { chromium } = require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:960,height:540},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
          await page.goto('http://127.0.0.1:8765/emotional-support-brick-3d/?capture=1',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(6500);
          const state=await page.evaluate(()=>{
          const c=document.querySelector('#world');
          return {loaded:!document.querySelector('#load'),webgl:!!c.getContext('webgl2'),width:c.width,height:c.height,frames:window.__brickFrames||0,calls:window.__brickDrawCalls||0,models:window.__brickModelStatus||{}};
          });
          console.log('INITIAL RENDER:',JSON.stringify({state,errors}));
          async function saveCanvas(filename){
          const data=await page.evaluate(()=>document.getElementById('world').toDataURL('image/png'));
          if(!data.startsWith('data:image/png;base64,'))throw new Error('Canvas did not return PNG');
          const bytes=Buffer.from(data.split(',')[1],'base64');fs.writeFileSync(filename,bytes);console.log('Captured',filename,bytes.length,'bytes');return bytes.length;
          }
          const first=await saveCanvas('brick-room-960x540.png');
          await page.evaluate(()=>document.getElementById('realistic').click());await page.waitForTimeout(1000);
          await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyW',key:'w'})));await page.waitForTimeout(500);await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keyup',{code:'KeyW',key:'w'})));
          const second=await saveCanvas('brick-rusty-960x540.png');
          await page.setViewportSize({width:1920,height:1080});
          await page.waitForTimeout(950);
          const size=await page.evaluate(()=>({width:document.getElementById('world').width,height:document.getElementById('world').height,frames:window.__brickFrames||0}));
          console.log('1080p CHECK:',JSON.stringify(size));
          await browser.close();
          if(errors.length||!state.loaded||!state.webgl||state.frames<2||!state.models.cartoon?.loaded||!state.models.realistic?.loaded||state.calls<5||first<10000||second<10000||size.width<1920||size.height<1080)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/brick-test.cjs
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-3d-browser-smoke
          path: brick-*.png
      - name: Record smoke test result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p .build-reports
          printf '{"result":"%s","run_id":"%s","source_commit":"%s"}\n' "$JOB_RESULT" "$GITHUB_RUN_ID" "$GITHUB_SHA" > .build-reports/brick-3d.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-reports/brick-3d.json
          git commit -m "Record Brick 3D browser smoke status" || true
          git push || true
