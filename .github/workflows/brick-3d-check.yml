name: Brick 3D browser smoke test
on:
  push:
    paths:
      - 'emotional-support-brick-3d/**'
      - '.github/workflows/brick-3d-check.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brick-3d-visual-check
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local browser game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/brick-server.log 2>&1 &
          sleep 3
      - name: Verify real 3D rendering and controls
        run: |
          cat > /tmp/brick-test.cjs <<'NODE'
          const { chromium } = require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:960,height:540},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
          await page.goto('http://127.0.0.1:8765/emotional-support-brick-3d/?capture=1',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(6500);
          const state=await page.evaluate(()=>{
          const c=document.querySelector('#world');
          return {loaded:!document.querySelector('#load'),webgl:!!c.getContext('webgl2'),width:c.width,height:c.height,frames:window.__brickFrames||0,calls:window.__brickDrawCalls||0,models:window.__brickModelStatus||{},cast:[...document.querySelectorAll('[data-brick-id]')].map(b=>b.dataset.brickId)};
          });
          console.log('INITIAL RENDER:',JSON.stringify({state,errors}));
          const expectedModels=['bricko','rusty','pulse','calm','spark','blocky','cozy','zapp','echo','gizmo'];
          const modelFiles=await Promise.all(expectedModels.map(async id=>{
            const res=await page.request.get('http://127.0.0.1:8765/emotional-support-brick-3d/assets/cast/'+id+'.glb');
            const bytes=await res.body();
            return {id,status:res.status(),size:bytes.length,magic:bytes.subarray(0,4).toString('ascii')};
          }));
          console.log('RIGGED MODEL FILES:',JSON.stringify(modelFiles));
          async function saveCanvas(filename){
          const data=await page.evaluate(()=>document.getElementById('world').toDataURL('image/png'));
          if(!data.startsWith('data:image/png;base64,'))throw new Error('Canvas did not return PNG');
          const bytes=Buffer.from(data.split(',')[1],'base64');fs.writeFileSync(filename,bytes);console.log('Captured',filename,bytes.length,'bytes');return bytes.length;
          }
          const first=await saveCanvas('brick-room-960x540.png');
          await page.evaluate(()=>document.querySelector('[data-brick-id="rusty"]').click());await page.waitForTimeout(1000);
          await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyW',key:'w'})));await page.waitForTimeout(500);await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keyup',{code:'KeyW',key:'w'})));
          const second=await saveCanvas('brick-rusty-960x540.png');
          for(const id of ['pulse','calm','spark','blocky','cozy','zapp','echo','gizmo']){
            await page.locator('[data-brick-id="'+id+'"]').click();await page.waitForTimeout(180);
            await saveCanvas('brick-'+id+'-960x540.png');
          }
          const features=await page.evaluate(()=>{
            const game=window.__brickActivities;
            if(!game)throw new Error('3D activity manager missing');
            document.getElementById('feedAction').click();
            const feed=game.getMode();
            document.getElementById('restAction').click();
            const sleep=game.getMode();
            document.getElementById('restAction').click();
            document.getElementById('danceAction').click();
            const dance=game.getMode();
            game.jenga();const jenga=game.getMode();
            game.stack();const stack=game.getMode();
            game.memory();const memory=game.getMode();
            game.stop();
            return {feed,sleep,dance,jenga,stack,memory,stats:game.getStats()};
          });
          const voiceFiles=await Promise.all(['bricko','rusty','pulse','calm','spark','blocky','cozy','zapp','echo','gizmo'].map(n=>n+'-hello.mp3').map(async n=>{
            const res=await page.request.get('http://127.0.0.1:8765/emotional-support-brick-3d/audio/cast/'+n);
            return {name:n,status:res.status(),bytes:(await res.body()).length};
          }));
          console.log('INTERACTIVE FEATURES:',JSON.stringify(features));
          console.log('RECORDED VOICES:',JSON.stringify(voiceFiles));

          await page.setViewportSize({width:1920,height:1080});
          // Software WebGL may render a frame very slowly: don't sample before
          // the viewport resize has actually reached the WebGL drawing buffer.
          await page.evaluate(()=>window.dispatchEvent(new Event('resize')));
          await page.waitForFunction(()=>{
            const c=document.getElementById('world');
            return c && c.width>=1920 && c.height>=1080;
          },null,{timeout:60000,polling:250});
          const size=await page.evaluate(()=>({width:document.getElementById('world').width,height:document.getElementById('world').height,frames:window.__brickFrames||0}));
          console.log('1080p CHECK:',JSON.stringify(size));
          const fullHD=await saveCanvas('brick-1080p.png');
          await browser.close();
          if(modelFiles.some(m=>m.status!==200||m.size<5000||m.magic!=='glTF')||Object.entries({feed:'feed',sleep:'sleep',dance:'dance',jenga:'jenga',stack:'stack',memory:'memory'}).some(([k,v])=>features[k]!==v)||voiceFiles.some(x=>x.status!==200||x.bytes<1000)||errors.length||!state.loaded||!state.webgl||state.frames<2||!state.cast||state.cast.length!==10||new Set(state.cast).size!==10||state.calls<5||first<10000||second<10000||size.width<1920||size.height<1080||fullHD<30000)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/brick-test.cjs
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-3d-browser-smoke
          path: brick-*.png
      - name: Record smoke test result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p .build-reports
          printf '{"result":"%s","run_id":"%s","source_commit":"%s"}\n' "$JOB_RESULT" "$GITHUB_RUN_ID" "$GITHUB_SHA" > .build-reports/brick-3d.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-reports/brick-3d.json
          git commit -m "Record Brick 3D browser smoke status" || true
          git push || true
