name: Diagnose DROPZONE mobile WebGL runtime
# Validation: published DROPZONE in portrait and Galaxy-class landscape viewports.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-dropzone-mobile-webgl.yml', 'dropzone/index.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Install Chromium
        run: |
          mkdir -p /tmp/webgl-mobile && cd /tmp/webgl-mobile
          npm init -y >/dev/null
          npm install playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test published DROPZONE in portrait and landscape
        run: |
          cat > /tmp/webgl-mobile/test.cjs <<'EOF'
          const {chromium}=require('playwright');
          const url='https://chrisnash25.github.io/SKB-MECH-MIND/dropzone/?test=mobile-webgl';
          const bad=/out of memory|webgl context lost|error loading|failed to load|abort\(/i;
          async function testViewport(browser,name,width,height){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text().slice(0,600))});
            await page.addInitScript(()=>{window.__contextLostObserved=false;document.addEventListener('webglcontextlost',()=>{window.__contextLostObserved=true},true)});
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            console.log(name+'_HTTP',res.status());
            await page.locator('#dz-launch').click({timeout:15000});
            console.log(name+'_START_CLICKED');
            for(let i=0;i<16;i++){
              await page.waitForTimeout(5000);
              if(await page.evaluate(()=>!document.querySelector('#status'))) break;
            }
            const state=await page.evaluate(()=>{
              const canvas=document.querySelector('#canvas');
              let gl=null;
              try{gl=canvas?.getContext('webgl2')}catch(e){}
              const rect=canvas?.getBoundingClientRect();
              return {
                viewport:{width:innerWidth,height:innerHeight},
                devicePixelRatio:devicePixelRatio,
                canvas:{width:canvas?.width,height:canvas?.height,clientWidth:rect?.width,clientHeight:rect?.height},
                webgl2Available:!!gl,
                contextLost:gl?.isContextLost(),
                everLost:window.__contextLostObserved,
                gameStarted:!document.querySelector('#status'),
                notice:document.querySelector('#status-notice')?.innerText||''
              };
            });
            console.log(name+'_WEBGL_RUNTIME',JSON.stringify(state));
            console.log(name+'_JAVASCRIPT_ERRORS',JSON.stringify(errors.slice(0,12)));
            await page.screenshot({path:'/tmp/dropzone-mobile-'+name+'.png',timeout:15000});
            const canvasLandscape=state.canvas.clientWidth>state.canvas.clientHeight;
            const fail=res.status()!==200 || !state.webgl2Available || state.contextLost || state.everLost ||
              !state.gameStarted || errors.some(e=>bad.test(e)) || (name==='landscape' && !canvasLandscape);
            await page.close();
            return fail;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            let failed=false;
            failed=await testViewport(browser,'portrait',390,844)||failed;
            failed=await testViewport(browser,'landscape',844,390)||failed;
            await browser.close();
            if(failed) process.exitCode=1;
          })().catch(e=>{console.error('BROWSER TEST ERROR',e);process.exitCode=1});
          EOF
          cd /tmp/webgl-mobile
          timeout 190s node test.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dropzone-mobile-portrait-landscape-screenshots
          path: /tmp/dropzone-mobile-*.png
          if-no-files-found: ignore
