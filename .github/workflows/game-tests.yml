name: Game regression tests
on:
  push:
    paths:
      - 'index.html'
      - 'multiplayer.js'
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/**'
      - '.github/workflows/game-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'multiplayer.js'
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/**'
      - '.github/workflows/game-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install browser and Firebase emulator test tools
        run: |
          npm install --no-save playwright@1.58.2 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.36.0
          npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: node tests/game.test.cjs
      - name: Test mobile touch navigation and responsive layouts
        run: node tests/mobile.test.cjs
      - name: Test Mechanism Lab Next experiment rotation
        run: node tests/lab-rotation.test.cjs
      - name: Test saved progress and corrupted storage recovery
        run: node tests/persistence.test.cjs
      - name: Syntax-check Firebase multiplayer module
        run: node --input-type=module --check < multiplayer.js
      - name: Simulate two-phone online battles in Chromium
        run: node tests/multiplayer.test.cjs
      - name: Verify actual Firestore Security Rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-mech-mind-rules "node tests/firestore-rules.test.cjs"
      - name: Upload mobile failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-regression-failures
          path: mobile-failure-*.png
          if-no-files-found: ignore
