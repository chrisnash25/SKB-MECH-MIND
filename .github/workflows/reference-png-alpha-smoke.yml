name: Alpha-safe TripoSR preprocessing diagnostic
run-name: Gizmo alpha-to-gray preprocessing test (diagnostic only; not approval)
on:
  push:
    branches: [reference-png-ten-real-mesh-and-animation]
    paths:
      - '.github/workflows/reference-png-alpha-smoke.yml'
      - 'tools/produce_reference_png_3d_alpha_smoke.py'
permissions:
  contents: read
jobs:
  gizmo-alpha-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHARACTER: gizmo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free generator client
        run: pip install --disable-pip-version-check 'gradio_client>=1.4,<3' Pillow requests numpy
      - name: Generate diagnostic mesh from alpha-aware neutral-gray input
        shell: bash
        run: |
          set -o pipefail
          python tools/produce_reference_png_3d_alpha_smoke.py 2>&1 | tee model.log
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - name: Rig and animate diagnostic mesh
        run: |
          blender -b -noaudio --python-exit-code 1 --python tools/rig_trellis_cast.py -- \
            "emotional-support-brick-3d/staging/reference-png-cast/$CHARACTER/$CHARACTER-raw.glb" \
            "emotional-support-brick-3d/staging/reference-png-cast/$CHARACTER/$CHARACTER-animated.glb"
      - name: Render diagnostic model before quality rejection
        run: blender -b -noaudio --python-exit-code 1 --python tools/render_reference_png_3d.py
      - name: Enforce PBR texture and animation gate
        run: |
          python - <<'PY'
          import json,struct,os,pathlib
          name=os.environ['CHARACTER']
          p=pathlib.Path(f'emotional-support-brick-3d/staging/reference-png-cast/{name}/{name}-animated.glb')
          b=p.read_bytes()
          assert b[:4]==b'glTF' and len(b)>100000
          n=struct.unpack_from('<I',b,12)[0]
          d=json.loads(b[20:20+n])
          assert d.get('skins') and len(d.get('animations',[]))>=4, 'Missing skin or four animation clips'
          assert d.get('materials') and d.get('textures') and d.get('images'), 'Rejected: no embedded PBR material textures'
          textured=[m for m in d['materials'] if m.get('pbrMetallicRoughness',{}).get('baseColorTexture')]
          assert textured, 'Rejected: no PBR base-colour texture is assigned'
          assert all(a.get('channels') and a.get('samplers') for a in d['animations']), 'Rejected: animation clip has no channels or samplers'
          print('PBR_TEXTURED_ANIMATED_GLB_VALID',name,len(b),len(d['animations']),len(d['textures']),len(d['images']))
          PY
      - name: Preserve diagnostic inputs, mesh and render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-smoke-gizmo-diagnostic
          path: |
            model.log
            emotional-support-brick-3d/staging/reference-png-cast/gizmo/
          if-no-files-found: warn
