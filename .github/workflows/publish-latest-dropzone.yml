name: Publish Latest DROPZONE West Walk Web
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-latest-dropzone.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve exact latest project
        env:
          SOURCE_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-1fc4-820c-9939-e1bf0210e97c/raw?se=2026-11-20T02%3A41%3A45Z&sp=r&sv=2026-06-06&sr=b&scid=37abaacd-1ab2-5ac1-a4c5-50c9f33d1d5b&skoid=0da8417a-a4c3-4a19-9b05-b82cee9d8868&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-19T19%3A06%3A50Z&ske=2026-11-20T19%3A06%3A50Z&sks=b&skv=2026-06-06&sig=bRgQ2MK8l9xrFeaf3MJE0wICSCOx58cLGX0bQ4I3EQE%3D'
        run: |
          mkdir -p /tmp/dropzone-src
          curl -fLsS --retry 3 "$SOURCE_URL" -o /tmp/dropzone-source.zip
          echo "b5e56cd70aab99a8d8f7fee60512201745a321c3ae959931acda7eeba3ac992e  /tmp/dropzone-source.zip" | sha256sum -c -
          unzip -q /tmp/dropzone-source.zip -d /tmp/dropzone-src
          test -f /tmp/dropzone-src/project.godot
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-web-templates
          cp -a /tmp/godot-web-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
      - name: Export latest web game
        run: |
          mkdir -p /tmp/dropzone-web
          cat > /tmp/dropzone-src/export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../dropzone-web/index.html"
          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF
          godot --headless --path /tmp/dropzone-src --editor --import
          godot --headless --path /tmp/dropzone-src --export-release Web /tmp/dropzone-web/index.html
          test -s /tmp/dropzone-web/index.pck
          test -s /tmp/dropzone-web/index.wasm
      - name: Split oversized PCK for GitHub Pages and install streaming loader
        run: |
          mkdir -p dropzone
          cp -a /tmp/dropzone-web/. dropzone/
          python3 - <<'PY'
          from pathlib import Path
          d=Path('dropzone')
          p=d/'index.pck'
          size=p.stat().st_size
          with p.open('rb') as f:
              for i in range(2):
                  data=f.read(52*1024*1024)
                  if data: (d/f'index.pck.part{i}').write_bytes(data)
          assert sum((d/f'index.pck.part{i}').stat().st_size for i in range(2))==size
          p.unlink()
          sw="""self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', e => {
            const url = new URL(e.request.url);
            if (!url.pathname.endsWith('/dropzone/index.pck')) return;
            e.respondWith((async () => {
              const parts = ['index.pck.part0','index.pck.part1'];
              const stream = new ReadableStream({
                async start(controller) {
                  try {
                    for (const part of parts) {
                      const r = await fetch(part);
                      if (!r.ok) throw new Error('Missing game data: ' + part);
                      const reader = r.body.getReader();
                      while (true) {
                        const {done,value} = await reader.read();
                        if (done) break;
                        controller.enqueue(value);
                      }
                    }
                    controller.close();
                  } catch (err) { controller.error(err); }
                }
              });
              return new Response(stream, {headers:{'Content-Type':'application/octet-stream'}});
            })());
          });
          """
          (d/'split-pck-sw.js').write_text(sw)
          html=(d/'index.html').read_text()
          assert 'engine.startGame({' in html
          html=html.replace('engine.startGame({',"""navigator.serviceWorker.register('./split-pck-sw.js').then(() => navigator.serviceWorker.ready).then(() => {
                  if (!navigator.serviceWorker.controller) { location.reload(); return; }
                  return engine.startGame({""",1)
          html=html.replace('}, displayFailureNotice);','}, displayFailureNotice);\n            });',1)
          (d/'index.html').write_text(html)
          (d/'BUILD-INFO.txt').write_text('DROPZONE latest West Walk Parking snapshot 18 Nov 2026\nSource SHA256: b5e56cd70aab99a8d8f7fee60512201745a321c3ae959931acda7eeba3ac992e\n')
          print('Web files:',[(f.name,f.stat().st_size) for f in d.iterdir()])
          PY
          test -s dropzone/index.html
          test -s dropzone/index.pck.part0
          test -s dropzone/index.pck.part1
          test -s dropzone/index.wasm
      - name: Publish into existing public GitHub Pages repository
        run: |
          git config user.name "DROPZONE Web Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add dropzone/
          git commit -m "Publish latest DROPZONE West Walk browser game" || exit 0
          git push origin HEAD:main
