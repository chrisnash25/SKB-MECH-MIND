<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#665545">
<title>Emotional Support Brick | 3D Lounge</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#473a30;font-family:system-ui,-apple-system,Arial,sans-serif;color:#f5edde}
#world{display:block;width:100vw;height:100dvh;touch-action:none}#overlay{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;left:18px;top:15px;max-width:340px;text-shadow:0 2px 7px #2118}
#title strong{display:block;font-family:Georgia,serif;font-size:clamp(21px,2.1vw,34px);line-height:1.07;color:#fff5e6}
#title small{font-size:14px;color:#f9e3c3}
#selector{position:absolute;top:100px;left:18px;display:flex;gap:8px;pointer-events:auto}
button{font:600 14px system-ui,-apple-system,sans-serif;border:1px solid #7b624e;border-radius:9px;padding:11px 14px;background:#e1d3bb;color:#342921;cursor:pointer;box-shadow:0 2px 8px #2118}
button:hover{background:#f5e8d0}button:focus-visible{outline:3px solid #fff}button:active{transform:translateY(1px)}
#status{position:absolute;top:17px;right:17px;background:#2e2925a9;border:1px solid #dbbfa26b;padding:8px 13px;border-radius:10px;font-size:12px;color:#efdfcb}
#speech{position:absolute;top:20%;left:50%;transform:translateX(-50%);max-width:355px;min-width:160px;white-space:normal;text-align:center;color:#35261d;background:#f8ebd8e8;padding:13px 19px;border-radius:21px;font-size:clamp(14px,1.4vw,18px);box-shadow:0 5px 20px #20150e4d}
#bottom{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:9px;align-items:center;justify-content:center;pointer-events:auto;max-width:96vw}
#bottom button{background:#d9c8aaee;min-width:94px}
#player{position:absolute;bottom:19px;left:18px;background:#312922c7;border:1px solid #b6a18777;padding:9px 13px;border-radius:11px;font-size:14px}
#player strong{color:#ffdfb6}
#help{position:absolute;right:17px;bottom:20px;background:#312922a8;padding:8px 11px;border-radius:9px;font-size:12px}
#chat{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);width:min(550px,92%);background:#f0e2cd;color:#33291f;padding:12px;border-radius:12px;pointer-events:auto;box-shadow:0 7px 22px #0006;display:flex;gap:8px}
#chat[hidden]{display:none}
#chat input{min-width:0;flex:1;border:1px solid #b49b7d;border-radius:8px;padding:10px;background:#fff9f2;color:#33291f;font:inherit}
#stick{display:none;position:absolute;left:23px;bottom:95px;width:106px;height:106px;border:2px solid #f4e5d4a1;border-radius:50%;background:#4d403a69;pointer-events:auto;touch-action:none}
#nub{position:absolute;top:31px;left:31px;width:40px;height:40px;border-radius:50%;background:#eee0c1b7;box-shadow:inset 0 2px 4px #fff5}
#load{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#2a2521f5;text-align:center;padding:24px;color:#f0dec7;font-size:18px;pointer-events:none}
@media(pointer:coarse){#stick{display:block}#help{display:none}}
@media(max-width:690px){#title strong{font-size:19px}#title small{font-size:12px}#selector{top:83px;flex-direction:column;gap:5px}#selector button{font-size:12px;padding:8px}#status{display:none}#speech{top:15%;left:58%;max-width:49vw;font-size:12px;padding:8px}#player{bottom:15px;left:8px;font-size:12px;padding:6px}#bottom{bottom:13px;left:auto;right:8px;transform:none;max-width:70%;gap:5px}#bottom button{font-size:12px;min-width:unset;padding:8px 9px}#chat{bottom:83px} }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
</head><body>
<canvas id="world" aria-label="Real-time 3D living room"></canvas>
<div id="overlay">
 <header id="title"><strong>Emotional Support<br>Brick Game</strong><small>Together We're Stronger!</small></header>
 <div id="selector"><button id="cartoon">Cartoon Brick</button><button id="realistic">Realistic Brick</button></div>
 <div id="status">LIVE 3D · WORK-IN-PROGRESS ART PASS</div>
 <div id="speech">Welcome home. Fancy a chat?</div>
 <div id="player">Playing as <strong id="name">Bricko</strong></div>
 <div id="help">WASD / Arrows: move · Drag: look · E: interact</div>
 <div id="stick"><div id="nub"></div></div>
 <div id="chat" hidden><input id="chatInput" type="text" maxlength="200" placeholder="Talk to your brick..." aria-label="Talk to your brick"><button id="send">Send</button></div>
 <nav id="bottom"><button id="chatButton">Talk</button><button id="mic">Microphone</button><button id="interact">Interact</button></nav>
 <div id="load">Loading your 3D lounge…</div>
</div>
<script type="module">
window.addEventListener('error',e=>{const box=document.getElementById('load');if(box)box.textContent='Game load error: '+e.message;});
import './scene.js';
document.getElementById('load').remove();
</script>
</body></html>
