<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Emotional Support Brick — 3D Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#29251f;color:#fff;font-family:system-ui}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}button,input{font:inherit}button{cursor:pointer;border:1px solid #6d4d32;border-radius:10px;padding:11px 15px;background:#f0e3cc;color:#38291d;box-shadow:0 2px 7px #0004}button:active{transform:scale(.97)}#top{position:absolute;top:12px;left:12px;background:#241b14b8;padding:12px 16px;border-radius:12px;max-width:380px}h1{font-size:19px;margin:0}small{opacity:.85}#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;pointer-events:auto;width:min(96%,760px)}#chat{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);width:min(94%,550px);background:#f1e6d7;color:#31291f;padding:12px;border-radius:13px;pointer-events:auto;display:none}#chat input{width:70%;padding:10px;border:1px solid #b8a28a;border-radius:8px}#chat p{margin:4px 0 10px}#choose{position:absolute;top:75px;left:12px;display:flex;gap:8px;pointer-events:auto}#hint{position:absolute;right:12px;top:14px;background:#241b14a6;padding:10px;border-radius:9px;font-size:13px}#joystick{position:absolute;bottom:104px;left:20px;width:110px;height:110px;border:2px solid #ffffff66;border-radius:50%;pointer-events:auto;touch-action:none;display:none}#nub{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#f0e3ccaa}@media(pointer:coarse){#joystick{display:block}#hint{display:none}}@media(max-width:600px){#top{max-width:245px}#choose{top:93px;flex-direction:column}#controls{bottom:8px}#chat{bottom:90px}}</style></head><body><div id="ui"><div id="top"><h1>Emotional Support Brick</h1><small>Together We're Stronger! · Early 3D prototype</small></div><div id="choose"><button id="cartoon">Cartoon Brick</button><button id="real">Realistic Brick</button></div><div id="hint">WASD / arrows: move · Drag: look · E: interact</div><div id="joystick"><div id="nub"></div></div><div id="chat"><p id="reply">Bricko: Fancy a chat?</p><input id="message" placeholder="Say something to your brick"><button id="send">Send</button></div><div id="controls"><button id="talk">Talk</button><button id="mic">Microphone</button><button id="pet">Interact</button><button id="walk">Walk / Stop</button><button id="reset">Reset view</button></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color('#d9c8b3');const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight('#fff2dc','#7a665b',2));const sun=new THREE.DirectionalLight('#ffdfad',3);sun.position.set(-4,7,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});function box(w,h,d,m,x,y,z,shadow=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}const floor=mat('#987d61'),wall=mat('#b39a80'),wood=mat('#72513b'),rug=mat('#c1ab93');box(16,.18,14,floor,0,-.1,0);box(16,7,.25,wall,0,3.3,-7);box(.25,7,14,wall,-8,3.3,0);box(.25,7,14,wall,8,3.3,0);box(5,.06,3.5,rug,0,.01,1);box(4,.65,1.3,mat('#796b63'),-4,.45,-4);box(4,.7,.7,mat('#796b63'),-4,1.1,-4.45);box(2.2,.12,1.2,wood,2,.75,-2.5);for(const x of [1.2,2.8])for(const z of [-3,-2])box(.12,.7,.12,wood,x,.36,z);for(let i=0;i<5;i++){box(.8,.08,.35,wood,-7.3,1+i*.5,-4);box(.25,.3,.25,mat(['#ac694f','#6b8472','#d4bd91'][i%3]),-7.3,1.18+i*.5,-4)}const windowFrame=mat('#655448');box(4.2,2.8,.05,mat('#b4cbd0',.2),3,3.7,-6.82,false);box(.08,2.9,.12,windowFrame,3,3.7,-6.72);box(4.3,.08,.12,windowFrame,3,3.7,-6.72);function makeBrick(real){const g=new THREE.Group();const brick=new THREE.Mesh(new THREE.BoxGeometry(1.5,.94,.63,2,2,2),mat(real?'#9e4c32':'#d56a43',real?.98:.82));brick.castShadow=true;g.add(brick);const dark=mat('#2b221f'),white=mat('#fff8ee',.3),iris=mat(real?'#493324':'#24618c',.25),pink=mat('#cf7c7c');for(const x of [-.37,.37]){let eye=new THREE.Mesh(new THREE.SphereGeometry(real?.14:.18,20,16),white);eye.position.set(x,.16,.335);eye.scale.z=.48;g.add(eye);let pupil=new THREE.Mesh(new THREE.SphereGeometry(real?.09:.115,16,12),iris);pupil.position.set(x,.16,.435);pupil.scale.z=.4;g.add(pupil);let cheek=new THREE.Mesh(new THREE.SphereGeometry(.11,12,10),pink);cheek.position.set(x*1.42,-.15,.34);cheek.scale.z=.24;g.add(cheek)}let mouth=new THREE.Mesh(new THREE.SphereGeometry(.15,20,14),dark);mouth.position.set(0,-.2,.355);mouth.scale.set(1,.6,.23);g.add(mouth);for(const x of [-.6,.6]){let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.35,4,8),dark);arm.position.set(x*1.42,-.3,0);arm.rotation.z=x>0?-.6:.6;g.add(arm);let shoe=new THREE.Mesh(new THREE.BoxGeometry(.34,.17,.5),mat(real?'#8a6948':'#c53c31'));shoe.position.set(x*.75,-.66,.15);g.add(shoe)}g.position.set(0,1.2,0);scene.add(g);return g}let avatar=makeBrick(false);let chosen=false;const buddy=makeBrick(true);buddy.position.set(2,1.2,-1.5);buddy.rotation.y=-.3;let yaw=0,pitch=.2,drag=false,lastX=0,lastY=0;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.003,-.25,.65);lastX=e.clientX;lastY=e.clientY});function switchBrick(real){scene.remove(avatar);avatar=makeBrick(real);chosen=real;avatar.position.set(0,1.2,0);document.getElementById('reply').textContent=(real?'Rusty':'Bricko')+': Hello there!';}document.getElementById('cartoon').onclick=()=>switchBrick(false);document.getElementById('real').onclick=()=>switchBrick(true);const chat=document.getElementById('chat'),reply=document.getElementById('reply');function say(t){reply.textContent=(chosen?'Rusty':'Bricko')+': '+t;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.pitch=chosen?.8:1.25;u.rate=chosen?.87:1.08;speechSynthesis.speak(u)}chat.style.display='block'}function interact(){avatar.rotation.z=.13;setTimeout(()=>avatar.rotation.z=0,350);say(chosen?'Steady on, mate. I am a brick, not a stress ball.':'Oi! That tickles. Well, as much as a brick can be tickled!')}document.getElementById('pet').onclick=interact;document.getElementById('talk').onclick=()=>chat.style.display=chat.style.display==='block'?'none':'block';function respond(){let q=document.getElementById('message').value.trim();if(!q)return;document.getElementById('message').value='';const l=q.toLowerCase();let answer=l.includes('name')?'My name is '+(chosen?'Rusty':'Bricko')+'. Nice to meet you!':l.includes('sad')||l.includes('upset')?'Sorry things are rough. Want to tell me about it, or shall we play?':l.includes('joke')?'I tried to join a band, but they said I was too heavy metal. Wrong building material, apparently.':l.includes('hello')||l.includes('hi')?'Hello! I was just sitting here being structurally sound.':l.includes('game')||l.includes('play')?'Absolutely! We should add some proper adventures next.': 'I heard you say: '+q+'. Tell me more!';say(answer)}document.getElementById('send').onclick=respond;document.getElementById('message').addEventListener('keydown',e=>{if(e.key==='Enter')respond()});document.getElementById('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){say('Your browser does not support microphone speech recognition. You can type instead.');return}let r=new R();r.lang='en-GB';r.onresult=e=>{document.getElementById('message').value=e.results[0][0].transcript;respond()};r.onerror=()=>say('I could not hear that. Try typing instead.');r.start()};let walking=false;document.getElementById('walk').onclick=()=>walking=!walking;document.getElementById('reset').onclick=()=>{yaw=0;pitch=.2;avatar.position.set(0,1.2,0)};let joyX=0,joyY=0;const stick=document.getElementById('joystick'),nub=document.getElementById('nub');stick.addEventListener('pointermove',e=>{if(!stick.hasPointerCapture(e.pointerId))return;const r=stick.getBoundingClientRect();joyX=THREE.MathUtils.clamp((e.clientX-r.left-r.width/2)/45,-1,1);joyY=THREE.MathUtils.clamp((e.clientY-r.top-r.height/2)/45,-1,1);nub.style.transform='translate('+joyX*35+'px,'+joyY*35+'px)'});stick.addEventListener('pointerdown',e=>stick.setPointerCapture(e.pointerId));stick.addEventListener('pointerup',()=>{joyX=joyY=0;nub.style.transform='' });const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX;let dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY-(walking?1:0);const len=Math.hypot(dx,dz);if(len>.1){dx/=len;dz/=len;const v=new THREE.Vector3(dx,0,dz).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);avatar.position.x=THREE.MathUtils.clamp(avatar.position.x+v.x*dt*2,-6,6);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z+v.z*dt*2,-5,5);avatar.rotation.y=Math.atan2(v.x,v.z);avatar.position.y=1.2+Math.sin(performance.now()*.013)*.07}else avatar.position.y=THREE.MathUtils.lerp(avatar.position.y,1.2,.1);const target=avatar.position.clone().add(new THREE.Vector3(0,.5,0));const offset=new THREE.Vector3(Math.sin(yaw)*4,2.5+pitch*4,Math.cos(yaw)*4);camera.position.lerp(target.clone().add(offset),.09);camera.lookAt(target);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
